name: Logs

# Manual: Actions → Logs → Run workflow. Prints the last app log lines (no secrets are logged by the app).
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Number of lines"
        default: "200"
      grep:
        description: "Only lines containing (optional)"
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install kamal -v 2.12.0 --no-document
      - name: App logs
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          KLAVIYO_PRIVATE_KEY: ""
          KLAVIYO_LIST_ID: ""
        run: |
          if [ -n "${{ inputs.grep }}" ]; then
            kamal app logs -n "${{ inputs.lines }}" --grep "${{ inputs.grep }}"
          else
            kamal app logs -n "${{ inputs.lines }}"
          fi
